name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Name the SDK packages this build actually needs (the app compiles against android-36).
      # The action's default list still includes the retired legacy `tools` package, and sdkmanager
      # exits 1 when it can't find it — that is what failed the first run 11 s in, before any Gradle
      # task started. `api-level` / `build-tools` are not inputs this action reads, so pinning them
      # here had no effect; build-tools are left to AGP, which downloads the version it wants once
      # the licences are accepted below.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36"
          accept-android-sdk-licenses: true

      - uses: gradle/actions/wrapper-validation@v3

      - uses: gradle/actions/setup-gradle@v3

      - name: Compile debug Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

  # The site is what the download CTA points at, so its type check, lint and prerender run on every
  # push too — they used to be a manual step that nothing enforced (roadmap §2bs).
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: TypeScript check
        working-directory: website
        run: npx tsc --noEmit

      - name: Lint
        working-directory: website
        run: npm run lint

      - name: Prerender build
        working-directory: website
        run: npm run build
